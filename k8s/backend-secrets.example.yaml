  REDIS_URL: redis://redis:6379
  JWT_SECRET: change-in-production-min-32-chars-long
  ETHEREUM_RPC_SEPOLIA: ""
  ETHEREUM_RPC_MAINNET: ""
  ETHEREUM_RPC_POLYGON: ""
  SOLANA_RPC_MAINNET: ""
  SOLANA_RPC_DEVNET: ""
  PIMLICO_API_KEY: ""
  PIMLICO_ENDPOINT: ""
  ALCHEMY_API_KEY: ""
  SUPABASE_URL: ""
  SUPABASE_KEY: ""
  WORKOS_API_KEY: ""
  WORKOS_CLIENT_ID: ""
  WORKOS_REDIRECT_URI: ""
  WORKOS_POST_LOGIN_REDIRECT: ""

