# EXAMPLE ONLY - never commit real values. This file is deliberately NOT part
# of backend.yaml, so re-applying backend.yaml can never overwrite real secrets.
# Create the real Secret with `kubectl create secret generic backend-secrets ...`
# (see docs/AWS_BEGINNER_GUIDE.md) or sync it from Secrets Manager with the
# External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: openprivy
type: Opaque
stringData:
