apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: openprivy
data:
  LOG_LEVEL: info
  CORS_ORIGINS: "https://openprivy.io,https://app.openprivy.io"

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: openprivy
type: Opaque
stringData:
  DATABASE_URL: postgresql://openprivy:changeme@postgres:5432/openprivy
  REDIS_URL: redis://redis:6379
  JWT_SECRET: change-in-production
  ENCRYPTION_KEY: change-in-production-min-32-chars
  ETHEREUM_RPC_SEPOLIA: ""
  ETHEREUM_RPC_MAINNET: ""
  POLYGON_RPC_URL: ""
  POLYGON_RPC_MUMBAI: ""
  SOLANA_RPC_URL: ""
  PIMLICO_API_KEY: ""
  ALCHEMY_API_KEY: ""
  SUPABASE_URL: ""
  SUPABASE_KEY: ""
  SUPABASE_JWT_SECRET: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: openprivy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: openprivy-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: backend

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: openprivy

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: openprivy
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: openprivy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
