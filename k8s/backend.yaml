apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: openprivy
data:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGINS: "https://openprivy.io,https://app.openprivy.io"
  DATABASE_SSL: "true"
  AWS_REGION: us-east-1
  CHAIN_ID: "11155111"
  # The master key is NOT stored here — only the ARN of the Secrets Manager
  # secret. The pod reads the value at boot using its IRSA role (see the
  # ServiceAccount annotation below). This keeps key material out of the cluster.
  ENCRYPTION_MASTER_KEY_SECRET_ARN: "arn:aws:secretsmanager:us-east-1:REPLACE_ACCOUNT_ID:secret:openprivy-prod/encryption/master-key"

---
# NOTE: These are the injection points, not the source of truth. In production
# they should be synced from AWS Secrets Manager by the External Secrets Operator
# or the Secrets Store CSI driver (see docs/AWS_PRODUCTION_DEPLOY.md), never
# committed with real values. The placeholders below let a cluster start in a
# non-production sandbox.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: openprivy
type: Opaque
stringData:
  DATABASE_URL: postgresql://openprivy:changeme@postgres:5432/openprivy
  REDIS_URL: redis://redis:6379
  JWT_SECRET: change-in-production-min-32-chars-long
  ETHEREUM_RPC_SEPOLIA: ""
  ETHEREUM_RPC_MAINNET: ""
  ETHEREUM_RPC_POLYGON: ""
  SOLANA_RPC_MAINNET: ""
  SOLANA_RPC_DEVNET: ""
  PIMLICO_API_KEY: ""
  PIMLICO_ENDPOINT: ""
  ALCHEMY_API_KEY: ""
  SUPABASE_URL: ""
  SUPABASE_KEY: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: openprivy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: openprivy-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      serviceAccountName: backend

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: openprivy
  annotations:
    # IRSA: bind this SA to an IAM role allowed to read the encryption master-key
    # secret (secretsmanager:GetSecretValue). Replace with the real role ARN.
    eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_ACCOUNT_ID:role/openprivy-backend-irsa"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: openprivy
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: openprivy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
