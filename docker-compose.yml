version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: openprivy-postgres
    environment:
      POSTGRES_DB: openprivy
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev-only-change-in-production
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d openprivy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openprivy

  redis:
    image: redis:7-alpine
    container_name: openprivy-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openprivy

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: openprivy-backend
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://app:dev-only-change-in-production@postgres:5432/openprivy
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_KEY: ${SUPABASE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9}
      ETHEREUM_RPC_SEPOLIA: ${ETHEREUM_RPC_SEPOLIA:-https://sepolia.infura.io/v3/}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-demo}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-min-32-chars-long}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/backend/src:/app/services/backend/src
      - ./logs:/app/logs
    networks:
      - openprivy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: openprivy-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend
    networks:
      - openprivy

  grafana:
    image: grafana/grafana:latest
    container_name: openprivy-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - openprivy

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  openprivy:
    driver: bridge
