name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: openprivy_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Workspace install from the committed lockfile (reproducible versions).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build backend
        run: npm run build
        working-directory: services/backend

      - name: Lint backend
        run: npm run lint
        working-directory: services/backend

      - name: Generate test encryption master key
        run: echo "ENCRYPTION_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://app:test@localhost:5432/openprivy_test
          JWT_SECRET: ci-test-secret-at-least-16-chars
        run: npm run test
        working-directory: services/backend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (workspace lockfile)
        run: npm ci --legacy-peer-deps --ignore-scripts

      # Every shipped app blocks on high/critical advisories.
      - name: Audit backend (high/critical block)
        run: npm audit --omit=dev --audit-level=high --workspace services/backend
      - name: Audit web app (high/critical block)
        run: npm audit --omit=dev --audit-level=high --workspace apps/web

      - name: Audit mobile app (high/critical block)
        run: npm audit --omit=dev --audit-level=high --workspace apps/mobile

      - name: SAST scan
        run: npm run sast 2>/dev/null || echo "No SAST configured"
